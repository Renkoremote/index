<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Renko Remote — Viewer</title>
<style>
  :root { --bg:#0f1420; --panel:#16203a; --line:#243049; --txt:#e6e9ef; --dim:#8a93a6; --accent:#1565c0; --accent2:#4fc3f7; --ok:#2ecc71; --danger:#e5484d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 18px; background:var(--accent); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; font-weight:700; color:#fff; }
  header .status, header #who { color:#dbe7ff; }
  header .sp { flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button.danger { background:var(--danger); }
  input { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px 12px; font-size:15px; width:100%; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px; }
  .screen { display:none; }
  .screen.on { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; transition:border-color .15s; }
  .card .body { flex:1; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .card:hover { border-color:var(--accent2); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.on { background:var(--ok); }
  .card .meta { flex:1; }
  .card .meta b { display:block; font-size:15px; }
  .card .meta span { color:var(--dim); font-size:12px; }
  .trash { background:transparent; border:0; color:var(--dim); font-size:18px; padding:6px 10px; cursor:pointer; }
  .trash:hover { color:var(--danger); }
  .status { color:var(--dim); font-size:13px; padding:8px 0; }
  /* session */
  #session { position:fixed; inset:0; background:#000; display:none; flex-direction:column; }
  #session.on { display:flex; }
  #sesBar { padding:10px 14px; background:var(--accent); display:flex; align-items:center; gap:10px; z-index:2; }
  #sesBar #sesStatus { color:#dbe7ff; }
  #sesName { flex:1; font-size:14px; }
  #stage { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #remote { max-width:100%; max-height:100%; background:#000; }
  #touch { position:absolute; inset:0; touch-action:none; }
  #hint { position:absolute; color:var(--dim); font-size:14px; pointer-events:none; }
  /* file manager due pannelli */
  #filePanel { position:absolute; inset:0; background:var(--bg); z-index:5; display:none; flex-direction:column; }
  #filePanel.on { display:flex; }
  #fmHead { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  #fmHead .ttl { flex:1; font-weight:600; }
  #panes { flex:1; display:flex; min-height:0; }
  .pane { flex:1; display:flex; flex-direction:column; min-width:0; }
  .pane + .pane { border-left:1px solid var(--line); }
  .paneBar { display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--panel); }
  .paneBar .p { flex:1; font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .paneBar button { padding:6px 10px; font-size:12px; }
  .list { flex:1; overflow:auto; }
  .frow { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .frow:hover { background:var(--panel); }
  .frow .ic { width:20px; text-align:center; }
  .frow .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .frow .sz { color:var(--dim); font-size:11px; }
  .frow .act { color:var(--accent); font-size:14px; padding:0 4px; }
  .paneTitle { font-size:12px; font-weight:600; padding:6px 12px; color:var(--dim); background:#11151c; }
  #fmStatus { padding:6px 12px; font-size:12px; color:var(--dim); border-top:1px solid var(--line); }
  @media (max-width:640px){ #panes { flex-direction:column; } .pane + .pane { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header class="listUI">
  <h1>🖥️ Renko Remote</h1><div class="sp"></div>
  <span id="who" class="status"></span>
  <button id="logout" class="ghost" style="display:none">Esci</button>
</header>

<div class="wrap">
  <section id="login" class="screen">
    <p class="status">Inserisci la mail master per vedere i tuoi dispositivi.</p>
    <div style="display:flex; gap:8px">
      <input id="email" type="email" placeholder="La tua mail master" autocomplete="email">
      <button id="enter">Entra</button>
    </div>
  </section>

  <section id="list" class="screen">
    <div id="devices"></div>
    <p id="listStatus" class="status"></p>
  </section>
</div>

<!-- SESSIONE -->
<section id="session">
  <div id="sesBar">
    <span id="sesName"></span>
    <span id="sesStatus" class="status"></span>
    <button id="btnFiles" class="ghost">📁 File</button>
    <button id="btnDisconnect" class="danger">✕ Disconnetti</button>
  </div>
  <div id="stage">
    <video id="remote" autoplay playsinline muted></video>
    <div id="touch"></div>
    <div id="hint">In attesa del video dal dispositivo…</div>
  </div>

  <!-- File manager due pannelli -->
  <div id="filePanel">
    <div id="fmHead">
      <span class="ttl">Trasferimento file</span>
      <button id="fmClose" class="ghost">✕ Chiudi</button>
    </div>
    <div id="panes">
      <!-- SINISTRA: PC -->
      <div class="pane">
        <div class="paneTitle">💻 Il tuo PC</div>
        <div class="paneBar">
          <button id="pcPick" class="ghost">Scegli cartella</button>
          <span id="pcPath" class="p">nessuna cartella aperta</span>
        </div>
        <div id="pcList" class="list"></div>
      </div>
      <!-- DESTRA: DISPOSITIVO -->
      <div class="pane">
        <div class="paneTitle">📱 Dispositivo</div>
        <div class="paneBar">
          <button id="devUp" class="ghost">⬆︎ Su</button>
          <span id="devPath" class="p"></span>
        </div>
        <div id="devList" class="list"></div>
      </div>
    </div>
    <div id="fmStatus"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ───────────────────────────── CONFIG ─────────────────────────────
const CFG = {
  SUPABASE_URL : "https://obifzajmyjkikdicexry.supabase.co",
  SUPABASE_KEY : "sb_publishable_2nTsqQPqA9S-w4bpbI8luw_dmqVh-pg",
  ICE : [{ urls: "stun:stun.l.google.com:19302" }]
};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id===id));
let email = localStorage.getItem('rr_email') || '';
const qs = new URLSearchParams(location.search);

function boot(){
  if (email){ $('#who').textContent = email; $('#logout').style.display=''; loadList(); }
  else show('login');
}
$('#enter').onclick = () => {
  const e = $('#email').value.trim().toLowerCase();
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(e)) return alert('Mail non valida');
  email = e; localStorage.setItem('rr_email', e);
  $('#who').textContent = e; $('#logout').style.display=''; loadList();
};
$('#logout').onclick = () => { localStorage.removeItem('rr_email'); location.reload(); };

// ───────────────────────────── LISTA DEVICE ───────────────────────
let devChannel = null;
async function loadList(){
  show('list');
  $('#listStatus').textContent = 'Caricamento…';
  const { data, error } = await sb.from('devices').select('*').eq('owner_email', email).order('name');
  if(error){ $('#listStatus').textContent = 'Errore: '+error.message; return; }
  renderDevices(data||[]);
  $('#listStatus').textContent = (data&&data.length)? '' : 'Nessun dispositivo registrato con questa mail.';
  if(devChannel) sb.removeChannel(devChannel);
  devChannel = sb.channel('devices-'+email)
    .on('postgres_changes', { event:'*', schema:'public', table:'devices', filter:'owner_email=eq.'+email },
        () => loadListQuiet())
    .subscribe();
  if(qs.get('device')){
    const d = (data||[]).find(x=>x.device_id===qs.get('device'));
    if(d) startSession(d);
  }
}
async function loadListQuiet(){
  const { data } = await sb.from('devices').select('*').eq('owner_email', email).order('name');
  renderDevices(data||[]);
}
function renderDevices(list){
  const box = $('#devices'); box.innerHTML='';
  list.forEach(d => {
    const el = document.createElement('div'); el.className='card';
    el.innerHTML = `<div class="body">
        <span class="dot ${d.online?'on':''}"></span>
        <div class="meta"><b>${d.name||'(senza nome)'}</b>
        <span>${d.model||''} · Android ${d.android_version||'?'} · ${d.backend||'backend n/d'} · ${d.online?'online':'offline'}</span></div>
      </div>
      <button class="trash" title="Elimina">🗑</button>`;
    el.querySelector('.body').onclick = () => startSession(d);
    el.querySelector('.trash').onclick = (ev) => { ev.stopPropagation(); deleteDevice(d); };
    box.appendChild(el);
  });
}
async function deleteDevice(d){
  if(!confirm(`Eliminare "${d.name||d.device_id}" dalla lista?`)) return;
  const { error } = await sb.from('devices').delete().eq('device_id', d.device_id);
  if(error) alert('Errore eliminazione: '+error.message);
  loadListQuiet();
}

// ───────────────────────────── SESSIONE WEBRTC ────────────────────
let pc=null, dc=null, dcFiles=null, sig=null, sessionId=null, current=null;

async function startSession(d){
  current = d; sessionId = crypto.randomUUID();
  $('#sesName').textContent = d.name || d.device_id;
  $('#sesStatus').textContent = 'connessione…';
  $('#hint').style.display=''; $('#filePanel').classList.remove('on');
  $('#session').classList.add('on');

  pc = new RTCPeerConnection({ iceServers: CFG.ICE });
  pc.addTransceiver('video', { direction:'recvonly' });
  dc = pc.createDataChannel('control');
  dcFiles = pc.createDataChannel('files'); dcFiles.binaryType='arraybuffer'; dcFiles.onmessage = onFilesMessage;

  pc.ontrack = (ev) => { $('#remote').srcObject = ev.streams[0]; $('#hint').style.display='none'; };
  pc.onicecandidate = (ev) => { if(ev.candidate) sendSignal('ice', ev.candidate); };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if(st==='connected') $('#sesStatus').textContent='🟢 Collegato con ' + (d.name || d.device_id);
    if(st==='failed' || st==='disconnected') $('#sesStatus').textContent='connessione persa';
  };

  sig = sb.channel('sig-'+sessionId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'signals', filter:'session_id=eq.'+sessionId },
      ({ new:row }) => {
        if(row.from_peer!=='device') return;
        if(row.type==='answer') pc.setRemoteDescription(row.payload);
        else if(row.type==='ice') pc.addIceCandidate(row.payload).catch(()=>{});
        else if(row.type==='bye'){ $('#sesStatus').textContent='chiusa dal dispositivo'; setTimeout(()=>endSession(false), 800); }
      }).subscribe();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await sendSignal('offer', offer);
}
async function sendSignal(type, payload){
  await sb.from('signals').insert({ session_id: sessionId, device_id: current.device_id, from_peer:'viewer', type, payload });
}
// notify=true → avvisa il client con un bye (disconnessione volontaria dal viewer)
async function endSession(notify){
  if(notify && dc){ try{ await sendSignal('bye', {}); }catch(e){} }
  if(sig) sb.removeChannel(sig); sig=null;
  if(pc) pc.close(); pc=null; dc=null; dcFiles=null;
  $('#remote').srcObject=null; $('#filePanel').classList.remove('on');
  $('#session').classList.remove('on');
  loadListQuiet();
}
$('#btnDisconnect').onclick = () => endSession(true);

// ───────────────────────────── CONTROLLO ─────
const touch = $('#touch'); let down=null;
function norm(ev){ const v=$('#remote'), r=v.getBoundingClientRect(); return { x:(ev.clientX-r.left)/r.width, y:(ev.clientY-r.top)/r.height }; }
function sendCmd(o){ if(dc&&dc.readyState==='open') dc.send(JSON.stringify(o)); }
touch.addEventListener('pointerdown', e=>{ down={p:norm(e),t:Date.now()}; });
touch.addEventListener('pointerup', e=>{
  if(!down) return; const p=norm(e); const dt=Date.now()-down.t;
  const moved=Math.hypot(p.x-down.p.x, p.y-down.p.y);
  if(moved>0.03) sendCmd({ t:'swipe', x1:down.p.x, y1:down.p.y, x2:p.x, y2:p.y, ms:Math.min(dt,800) });
  else sendCmd({ t:'tap', x:p.x, y:p.y });
  down=null;
});

// ───────────────────────────── FILE MANAGER (2 pannelli) ─────────────────────────────
let devPath='', devUpPath='', incoming=null, incomingResolve=null;
let pcDirHandle=null, pcStack=[];   // File System Access API

function fmStatus(s){ $('#fmStatus').textContent = s || ''; }
function fpSend(o){ if(dcFiles && dcFiles.readyState==='open') dcFiles.send(JSON.stringify(o)); }

$('#btnFiles').onclick = () => {
  if(!dcFiles || dcFiles.readyState!=='open'){ fmStatus('canale file non pronto, attendi la connessione'); }
  $('#filePanel').classList.add('on');
  fpSend({ op:'ls', path:'' });
  renderPc();
};
$('#fmClose').onclick = () => $('#filePanel').classList.remove('on');
$('#devUp').onclick = () => fpSend({ op:'ls', path:devUpPath });

function human(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB'; return (n/1048576).toFixed(1)+' MB'; }

// ---- lato DISPOSITIVO ----
function onFilesMessage(e){
  if(typeof e.data !== 'string'){
    if(incoming){ incoming.chunks.push(e.data); }
    return;
  }
  const m = JSON.parse(e.data);
  if(m.op==='ls_res'){ devPath=m.path; devUpPath=m.up; renderDev(m); fmStatus(''); }
  else if(m.op==='err'){ fmStatus('⚠ '+m.msg); }
  else if(m.op==='get_begin'){ incoming={ name:m.name, size:m.size, chunks:[] }; fmStatus('scarico '+m.name+'…'); }
  else if(m.op==='get_end'){ finishIncoming(); }
  else if(m.op==='put_ok'){ fmStatus('inviato ✓'); fpSend({ op:'ls', path:devPath }); }
}
async function finishIncoming(){
  const blob = new Blob(incoming.chunks); const name = incoming.name;
  if(incomingResolve){ incomingResolve(blob); incomingResolve=null; incoming=null; return; }
  // download nel browser
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  URL.revokeObjectURL(a.href); fmStatus('scaricato '+name); incoming=null;
}
function renderDev(m){
  $('#devPath').textContent = m.path;
  const box=$('#devList'); box.innerHTML='';
  (m.entries||[]).forEach(en=>{
    const full = m.path.replace(/\/$/,'') + '/' + en.n;
    const row=document.createElement('div'); row.className='frow';
    row.innerHTML = `<span class="ic">${en.d?'📁':'📄'}</span>
      <span class="nm">${en.n}</span>
      <span class="sz">${en.d?'':human(en.s)}</span>
      ${en.d?'':'<span class="act" title="Copia sul PC">⬅</span>'}`;
    row.querySelector('.nm').onclick = ()=>{ if(en.d) fpSend({op:'ls',path:full}); };
    row.querySelector('.ic').onclick = ()=>{ if(en.d) fpSend({op:'ls',path:full}); };
    const act=row.querySelector('.act'); if(act) act.onclick=()=>devToPc(full, en.n);
    box.appendChild(row);
  });
}

// ---- lato PC (File System Access API) ----
async function renderPc(){
  const box=$('#pcList'); box.innerHTML='';
  if(!window.showDirectoryPicker){
    box.innerHTML = '<div class="status" style="padding:12px">Il browser non supporta la navigazione cartelle. '+
      'Usa Chrome/Edge su PC. In alternativa i download finiscono nella cartella Download.</div>';
    return;
  }
  if(!pcDirHandle){
    $('#pcPath').textContent='nessuna cartella aperta';
    box.innerHTML = '<div class="status" style="padding:12px; line-height:1.5">'+
      'Premi <b>Scegli cartella</b> e seleziona una <b>cartella normale</b>.<br>'+
      'Chrome blocca Desktop, Download e Documenti ("file di sistema"): '+
      'crea una sottocartella (es. <b>Desktop\\RenkoTransfer</b>) e scegli quella.</div>';
    return;
  }
  $('#pcPath').textContent = pcStack.map(h=>h.name).join('/') || pcDirHandle.name;
  // riga "su" se dentro una sottocartella
  if(pcStack.length){
    const up=document.createElement('div'); up.className='frow';
    up.innerHTML='<span class="ic">↩</span><span class="nm">..</span>';
    up.onclick=()=>{ pcStack.pop(); renderPc(); };
    box.appendChild(up);
  }
  const cur = pcStack.length ? pcStack[pcStack.length-1] : pcDirHandle;
  const items=[];
  for await (const [name,handle] of cur.entries()) items.push([name,handle]);
  items.sort((a,b)=> (a[1].kind!=='directory')-(b[1].kind!=='directory') || a[0].localeCompare(b[0]));
  for(const [name,handle] of items){
    const dir = handle.kind==='directory';
    const row=document.createElement('div'); row.className='frow';
    row.innerHTML = `<span class="ic">${dir?'📁':'📄'}</span>
      <span class="nm">${name}</span>
      ${dir?'':'<span class="act" title="Invia al dispositivo">➡</span>'}`;
    row.querySelector('.nm').onclick=()=>{ if(dir){ pcStack.push(handle); renderPc(); } };
    row.querySelector('.ic').onclick=()=>{ if(dir){ pcStack.push(handle); renderPc(); } };
    const act=row.querySelector('.act'); if(act) act.onclick=()=>pcToDev(handle,name);
    box.appendChild(row);
  }
}
$('#pcPick').onclick = async ()=>{
  if(!window.showDirectoryPicker){ fmStatus('browser senza supporto cartelle'); return; }
  try{ pcDirHandle = await window.showDirectoryPicker({ mode:'readwrite' }); pcStack=[]; renderPc(); }
  catch(e){ /* annullato */ }
};

// ---- trasferimenti ----
async function pcToDev(fileHandle, name){
  fmStatus('invio '+name+' al dispositivo…');
  const file = await fileHandle.getFile();
  fpSend({ op:'put_begin', path:devPath, name });
  const CHUNK=16*1024; const buf=await file.arrayBuffer();
  for(let off=0; off<buf.byteLength; off+=CHUNK){
    while(dcFiles.bufferedAmount>1_000_000) await new Promise(r=>setTimeout(r,15));
    dcFiles.send(buf.slice(off, off+CHUNK));
  }
  fpSend({ op:'put_end' });
}
async function devToPc(path, name){
  if(!pcDirHandle){ fmStatus('scegli prima una cartella PC (o il file andrà nei Download)'); }
  fmStatus('copio '+name+' sul PC…');
  const blobP = new Promise(res=> incomingResolve=res);
  fpSend({ op:'get', path });
  const blob = await blobP;
  try{
    if(pcDirHandle){
      const dest = pcStack.length ? pcStack[pcStack.length-1] : pcDirHandle;
      const fh = await dest.getFileHandle(name, { create:true });
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      fmStatus('copiato sul PC: '+name); renderPc();
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
      fmStatus('scaricato '+name);
    }
  }catch(e){ fmStatus('errore scrittura PC: '+e.message); }
}

boot();
</script>
</body>
</html>
