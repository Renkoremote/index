<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Renko Remote — Viewer</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1e27; --line:#2a3140; --txt:#e6e9ef; --dim:#8a93a6; --accent:#2f81f7; --ok:#2ecc71; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sp { flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  input { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:10px 12px; font-size:15px; width:100%; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px; }
  .screen { display:none; }
  .screen.on { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.on { background:var(--ok); }
  .card .meta { flex:1; }
  .card .meta b { display:block; font-size:15px; }
  .card .meta span { color:var(--dim); font-size:12px; }
  .status { color:var(--dim); font-size:13px; padding:8px 0; }
  /* session */
  #session { position:fixed; inset:0; background:#000; display:none; flex-direction:column; }
  #session.on { display:flex; }
  #sesBar { padding:10px 14px; background:#11151c; display:flex; align-items:center; gap:10px; z-index:2; }
  #sesBar .name { flex:1; font-size:14px; }
  #stage { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #remote { max-width:100%; max-height:100%; background:#000; }
  #touch { position:absolute; inset:0; touch-action:none; }
  #hint { position:absolute; color:var(--dim); font-size:14px; pointer-events:none; }
</style>
</head>
<body>
<!-- Barra alta (login + lista) -->
<header class="listUI">
  <h1>🖥️ Renko Remote</h1><div class="sp"></div>
  <span id="who" class="status"></span>
  <button id="logout" class="ghost" style="display:none">Esci</button>
</header>

<div class="wrap">
  <!-- LOGIN -->
  <section id="login" class="screen">
    <p class="status">Inserisci la mail master per vedere i tuoi dispositivi.</p>
    <div style="display:flex; gap:8px">
      <input id="email" type="email" placeholder="La tua mail master" autocomplete="email">
      <button id="enter">Entra</button>
    </div>
  </section>

  <!-- LISTA -->
  <section id="list" class="screen">
    <div id="devices"></div>
    <p id="listStatus" class="status"></p>
  </section>
</div>

<!-- SESSIONE (fullscreen) -->
<section id="session">
  <div id="sesBar">
    <button id="back" class="ghost">← Indietro</button>
    <span class="name" id="sesName"></span>
    <span id="sesStatus" class="status">connessione…</span>
  </div>
  <div id="stage">
    <video id="remote" autoplay playsinline muted></video>
    <div id="touch"></div>
    <div id="hint">In attesa del video dal dispositivo…</div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ───────────────────────────── CONFIG ─────────────────────────────
const CFG = {
  SUPABASE_URL : "https://obifzajmyjkikdicexry.supabase.co",
  SUPABASE_KEY : "sb_publishable_2nTsqQPqA9S-w4bpbI8luw_dmqVh-pg",
  // STUN pubblico per iniziare. TURN (Cloudflare) lo aggiungiamo dopo per i NAT dei locali.
  ICE : [{ urls: "stun:stun.l.google.com:19302" }]
};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);

// ───────────────────────────── UI helpers ─────────────────────────
const $ = s => document.querySelector(s);
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id===id));
let email = localStorage.getItem('rr_email') || '';

function boot(){
  if (email){ $('#who').textContent = email; $('#logout').style.display=''; loadList(); }
  else show('login');
}
$('#enter').onclick = () => {
  const e = $('#email').value.trim().toLowerCase();
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(e)) return alert('Mail non valida');
  email = e; localStorage.setItem('rr_email', e);
  $('#who').textContent = e; $('#logout').style.display='';
  loadList();
};
$('#logout').onclick = () => { localStorage.removeItem('rr_email'); location.reload(); };

// deep-link: ?device=<id> apre direttamente la sessione
const qs = new URLSearchParams(location.search);

// ───────────────────────────── LISTA DEVICE ───────────────────────
let devChannel = null;
async function loadList(){
  show('list');
  $('#listStatus').textContent = 'Caricamento…';
  const { data, error } = await sb.from('devices').select('*')
      .eq('owner_email', email).order('name');
  if(error){ $('#listStatus').textContent = 'Errore: '+error.message; return; }
  renderDevices(data||[]);
  $('#listStatus').textContent = (data&&data.length)? '' : 'Nessun dispositivo registrato con questa mail.';

  // realtime: aggiorna stato online al volo
  if(devChannel) sb.removeChannel(devChannel);
  devChannel = sb.channel('devices-'+email)
    .on('postgres_changes', { event:'*', schema:'public', table:'devices',
         filter:'owner_email=eq.'+email }, () => loadListQuiet())
    .subscribe();

  if(qs.get('device')){
    const d = (data||[]).find(x=>x.device_id===qs.get('device'));
    if(d) startSession(d);
  }
}
async function loadListQuiet(){
  const { data } = await sb.from('devices').select('*').eq('owner_email', email).order('name');
  renderDevices(data||[]);
}
function renderDevices(list){
  const box = $('#devices'); box.innerHTML='';
  list.forEach(d => {
    const el = document.createElement('div'); el.className='card';
    el.innerHTML = `<span class="dot ${d.online?'on':''}"></span>
      <div class="meta"><b>${d.name||'(senza nome)'}</b>
      <span>${d.model||''} · Android ${d.android_version||'?'} · ${d.backend||'backend n/d'}</span></div>
      <span class="status">${d.online?'online':'offline'}</span>`;
    el.onclick = () => startSession(d);
    box.appendChild(el);
  });
}

// ───────────────────────────── SESSIONE WEBRTC ────────────────────
let pc=null, dc=null, sig=null, sessionId=null, current=null;

async function startSession(d){
  current = d; sessionId = crypto.randomUUID();
  $('#sesName').textContent = d.name || d.device_id;
  $('#sesStatus').textContent = 'connessione…';
  $('#hint').style.display='';
  document.getElementById('session').classList.add('on');

  pc = new RTCPeerConnection({ iceServers: CFG.ICE });

  // vogliamo ricevere il video del tablet
  pc.addTransceiver('video', { direction:'recvonly' });
  // canale per i comandi (tap/swipe) verso il tablet
  dc = pc.createDataChannel('control');
  dc.onopen = () => $('#sesStatus').textContent = 'connesso';

  pc.ontrack = (ev) => {
    $('#remote').srcObject = ev.streams[0];
    $('#hint').style.display='none';
  };
  pc.onicecandidate = (ev) => { if(ev.candidate) sendSignal('ice', ev.candidate); };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if(st==='connected') $('#sesStatus').textContent='connesso';
    if(st==='failed' || st==='disconnected') $('#sesStatus').textContent='connessione persa';
  };

  // ascolta risposte dal device per questa sessione
  sig = sb.channel('sig-'+sessionId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'signals',
         filter:'session_id=eq.'+sessionId }, ({ new:row }) => {
      if(row.from_peer!=='device') return;
      if(row.type==='answer') pc.setRemoteDescription(row.payload);
      else if(row.type==='ice') pc.addIceCandidate(row.payload).catch(()=>{});
    })
    .subscribe();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await sendSignal('offer', offer);
}

async function sendSignal(type, payload){
  await sb.from('signals').insert({
    session_id: sessionId, device_id: current.device_id,
    from_peer: 'viewer', type, payload
  });
}

function endSession(){
  try{ if(dc&&dc.readyState==='open') { sendSignal('bye', {}); } }catch(e){}
  if(sig) sb.removeChannel(sig); sig=null;
  if(pc) pc.close(); pc=null; dc=null;
  $('#remote').srcObject=null;
  document.getElementById('session').classList.remove('on');
}
$('#back').onclick = endSession;

// ───────────────────────────── CONTROLLO (coord normalizzate) ─────
const touch = $('#touch'); let down=null;
function norm(ev){
  const v=$('#remote'), r=v.getBoundingClientRect();
  return { x:(ev.clientX-r.left)/r.width, y:(ev.clientY-r.top)/r.height };
}
function sendCmd(o){ if(dc&&dc.readyState==='open') dc.send(JSON.stringify(o)); }
touch.addEventListener('pointerdown', e=>{ down={p:norm(e),t:Date.now()}; });
touch.addEventListener('pointerup', e=>{
  if(!down) return; const p=norm(e); const dt=Date.now()-down.t;
  const moved=Math.hypot(p.x-down.p.x, p.y-down.p.y);
  if(moved>0.03) sendCmd({ t:'swipe', x1:down.p.x, y1:down.p.y, x2:p.x, y2:p.y, ms:Math.min(dt,800) });
  else sendCmd({ t:'tap', x:p.x, y:p.y });
  down=null;
});

boot();
</script>
</body>
</html>
